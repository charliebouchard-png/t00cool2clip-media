name: clipdesk-render
# ClipDesk Mk II, Agent 3 (Fast Editor) in the cloud: renders shorts/plans/<name>.json from a source video URL.
# Words come from branch clipsrc-<name> (transcribe workflow). Output branch cd-<name>:
#   out/<name>/final_<n>.mp4 (post these), previews/<name>/<n>.mp4 (540p, for the HUD), previews/<name>/<n>.jpg
on:
  workflow_dispatch:
    inputs:
      name: { description: 'plan name (shorts/plans/<name>.json)', required: true }
      src_url: { description: 'direct download URL of the source video', required: true }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q opencv-python-headless
      - name: Source + words
        env: { SRC: '${{ inputs.src_url }}', N: '${{ inputs.name }}' }
        run: |
          mkdir -p /tmp/shorts/$N
          git fetch -q origin clipsrc-$N && git show FETCH_HEAD:clipsrc/$N/words.json > /tmp/shorts/$N/words.json
          curl -sSL --fail --retry 3 --max-time 1800 -o /tmp/shorts/$N/src.mp4 "$SRC"
          ls -la /tmp/shorts/$N
      - name: Render (2 parallel workers)
        env: { N: '${{ inputs.name }}' }
        run: |
          C=$(python3 -c "import json;print(len(json.load(open('shorts/plans/$N.json'))['clips']))")
          A=$(seq -s, 1 2 $C); B=$(seq -s, 2 2 $C)
          ONLY=$A python3 shorts/make.py shorts/plans/$N.json > /tmp/a.log 2>&1 & P1=$!
          [ -n "$B" ] && { ONLY=$B python3 shorts/make.py shorts/plans/$N.json > /tmp/b.log 2>&1 & P2=$!; }
          wait $P1; R1=$?; R2=0; [ -n "$P2" ] && { wait $P2; R2=$?; }
          cat /tmp/a.log /tmp/b.log 2>/dev/null; [ $R1 = 0 ] && [ $R2 = 0 ]
      - name: Previews + push
        env: { N: '${{ inputs.name }}' }
        run: |
          W=/tmp/shorts/$N; O=$(mktemp -d); mkdir -p $O/out/$N $O/previews/$N
          for f in $W/final_*.mp4; do n=$(basename $f .mp4 | sed 's/final_//'); cp $f $O/out/$N/
            ffmpeg -loglevel error -y -i $f -vf scale=540:-2 -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 64k -movflags +faststart $O/previews/$N/$n.mp4
            ffmpeg -loglevel error -y -ss 1.5 -i $f -frames:v 1 -vf scale=360:-2 -q:v 4 $O/previews/$N/$n.jpg; done
          cp shorts/plans/$N.json $O/out/$N/plan.json
          cd $O && git init -q && git checkout -q -b cd-$N && git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "clipdesk $N"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cd-$N
          echo "pushed cd-$N: $(ls out/$N | wc -l) files"
