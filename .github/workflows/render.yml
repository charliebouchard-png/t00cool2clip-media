name: render-clips
on:
  workflow_dispatch:
    inputs:
      url:
        description: Source video download URL
        required: true
      jobs:
        description: Jobs file in jobs/
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download source
        env:
          SRC_URL: ${{ inputs.url }}
        run: curl -sSfL --retry 3 -o "$RUNNER_TEMP/src.mp4" "$SRC_URL" && ls -la "$RUNNER_TEMP/src.mp4"
      - name: Render
        run: python3 tools/render.py "$RUNNER_TEMP/src.mp4" "jobs/${{ inputs.jobs }}" clips
      - name: Push clips to a temporary branch
        run: |
          B="render-${{ inputs.jobs }}"; B="${B%.json}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$B"
          git add -f clips/*.mp4
          git commit -m "Rendered clips from ${{ inputs.jobs }} (temporary, deleted after delivery)"
          git push -f origin "$B"
