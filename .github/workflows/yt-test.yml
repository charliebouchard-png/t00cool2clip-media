name: yt-test
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q -U yt-dlp && yt-dlp --version
      - run: yt-dlp -F "${{ inputs.url }}" 2>&1 | tail -25
      - run: yt-dlp -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]" --download-sections "*0:00-0:20" -o t.mp4 "${{ inputs.url }}" 2>&1 | tail -8 && ls -la t.mp4
