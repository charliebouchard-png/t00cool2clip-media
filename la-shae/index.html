<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Website Previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/* Layout: one concept homepage per business, chosen by the link's #name; themed per trade */
:root{
  --bg:#fbfaf7; --surface:#ffffff; --ink:#15171a; --mute:#5f6670; --line:#e6e4df;
  --brand:#1f4d3a; --brand-ink:#ffffff; --accent:#e9a6a6; --hero-bg:#1f4d3a; --hero-ink:#ffffff;
  --display:'Fraunces',Georgia,serif; --body:Inter,system-ui,sans-serif; color-scheme:light;
}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
*{box-sizing:border-box}
.concept{background:#15171a;color:#fff;text-align:center;font:600 12px/1.4 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.concept a{color:#ffd23f}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.logo{font:800 22px/1.1 var(--display);color:var(--brand);letter-spacing:-.01em}
nav{display:flex;gap:18px;font:600 14px var(--body);flex-wrap:wrap}
nav span{color:var(--ink)}
.hero{background:var(--hero-bg);color:var(--hero-ink)}
.hero .in{padding-block:44px 52px;display:grid;gap:18px}
.place{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
h1{font:800 clamp(36px,6.5vw,66px)/1.03 var(--display);margin:0;letter-spacing:-.02em;max-width:17ch;text-wrap:balance}
.hero p{margin:0;font-size:18px;max-width:52ch;opacity:.92}
.status{display:inline-flex;align-items:center;gap:9px;width:max-content;max-width:100%;background:rgba(255,255,255,.14);border-radius:999px;padding:7px 14px;font:600 14px var(--body)}
.dot{width:9px;height:9px;border-radius:50%;background:#7ef0b1;flex:0 0 auto}
.dot.off{background:#ff9b9b}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;padding:14px 20px;border-radius:12px;font:700 15px var(--body);border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.ghost{border-color:rgba(255,255,255,.55);color:var(--hero-ink)}
.trust{display:flex;gap:8px;flex-wrap:wrap}
.trust span{font:600 13px var(--body);padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
main .in{display:grid;gap:36px;padding-block:36px 48px}
h2{font:800 26px/1.15 var(--display);margin:0 0 14px;color:var(--brand);text-wrap:balance}
.grid2{display:grid;gap:28px}
@media(min-width:820px){.grid2{grid-template-columns:1.3fr 1fr}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.row span{color:var(--mute);font-variant-numeric:tabular-nums}
.callout{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px 18px}
.callout b{display:block;margin-bottom:4px}
.contact{display:grid;gap:6px;font-size:15px}
.contact .k{color:var(--mute);font-size:13px}
footer{background:var(--hero-bg);color:var(--hero-ink)}
footer .in{padding-block:22px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;opacity:.92}
.note{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));font-size:13.5px;color:var(--mute)}
.home{min-height:70vh;display:grid;place-items:center;text-align:center;padding:40px 16px}
.home h1{color:var(--ink);max-width:20ch;margin:0 auto}
.home p{color:var(--mute);max-width:46ch;margin:14px auto 0}
/* trade themes */
body[data-cat="florist"]{--brand:#2d5a43;--hero-bg:#2d5a43;--accent:#f2b8c0;--bg:#fbf8f6}
body[data-cat="valet"]{--brand:#0f1624;--hero-bg:#0b1220;--accent:#3fd0ff;--bg:#f4f6f9;--display:'Space Grotesk',system-ui,sans-serif}
body[data-cat="cafe"]{--brand:#4a2c1d;--hero-bg:#3b2418;--accent:#f0c06a;--bg:#faf7f2}
body[data-cat="hair"]{--brand:#4b2346;--hero-bg:#3d1c3a;--accent:#e8c47a;--bg:#faf7f9}
body[data-cat="cleaning"]{--brand:#0d3b66;--hero-bg:#0d3b66;--accent:#5ee3d2;--bg:#f3f8fb;--display:'Space Grotesk',system-ui,sans-serif}
body[data-cat="nails"]{--brand:#7a2e4a;--hero-bg:#2b1c22;--accent:#f4a6c0;--bg:#fcf7f8}
body[data-cat="landscaping"]{--brand:#33502b;--hero-bg:#2c4425;--accent:#d9c08a;--bg:#f7f6f1}
body[data-cat="tattoo"]{--brand:#111111;--hero-bg:#0d0d0d;--accent:#e2392f;--bg:#f4f2ef;--display:'Archivo Black',Impact,sans-serif}
body[data-cat="tattoo"] .btn.primary{color:#fff}
body[data-cat="dog"]{--brand:#13575a;--hero-bg:#13575a;--accent:#ffd166;--bg:#f6faf9}
</style>

<div class="concept" id="concept">Concept preview by Charlie Bouchard · Not this business's official website</div>
<div id="app"></div>

<script>window.SLUG="la-shae";</script><script src="../data.js"></script>
<script>
(function(){
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const app=document.getElementById("app");
  function todayLine(hours){
    const d=new Date().toLocaleDateString("en-GB",{weekday:"short",timeZone:"Europe/London"}).slice(0,3);
    const order=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const idx=order.indexOf(d);
    for(const [k,v] of hours){
      const m=k.match(/(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*(?:\s*[–-]\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*)?/);
      if(!m) continue;
      const a=order.indexOf(m[1]), b=m[2]?order.indexOf(m[2]):a;
      if(idx>=a&&idx<=b) return {open:!/closed/i.test(v), text:(/closed/i.test(v)?"Closed today":"Open today · "+v)};
    }
    return {open:true,text:hours[0]?hours[0][0]+" · "+hours[0][1]:""};
  }
  function render(){
    let raw=window.SLUG||(location.hash||"").slice(1);
    try{raw=decodeURIComponent(raw)}catch(e){}
    const slug=raw.toLowerCase().replace(/[^a-z0-9-]/g,"").replace(/^-+|-+$/g,"");
    const all=window.PREVIEWS||{};
    let P=all[slug];
    if(!P&&slug){const k=Object.keys(all).find(k=>slug.includes(k)||k.includes(slug));if(k)P=all[k];}
    if(!P){
      document.body.dataset.cat="";
      document.title="Website Previews";
      app.innerHTML=`<div class="home"><div><h1>Website previews by Charlie Bouchard</h1><p>Each preview is a free concept made for one local business. Type your business name to open yours.</p><input id="find" type="search" placeholder="Your business name" autocomplete="off" style="margin-top:20px;width:100%;max-width:360px;font:16px Inter,sans-serif;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)"><div id="hit" style="margin-top:14px"></div></div></div>`;
      const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
      const f=document.getElementById("find"),hit=document.getElementById("hit");
      f.addEventListener("input",()=>{const q=norm(f.value);hit.innerHTML="";if(q.length<4)return;const k=Object.keys(all).find(k=>norm(all[k].name).includes(q)||q.includes(norm(all[k].name)));if(k){const b=document.createElement("button");b.textContent="Open the "+all[k].name+" preview";b.style.cssText="font:700 15px Inter,sans-serif;padding:14px 20px;border-radius:12px;border:0;background:#15171a;color:#fff;cursor:pointer";b.onclick=()=>{location.href=k+"/";};hit.appendChild(b);}});
      return;
    }
    document.body.dataset.cat=P.cat;
    document.title=P.name+" · preview";
    const st=todayLine(P.hours);
    const nav={florist:["Shop","Weddings","Tributes","Contact"],valet:["Services","Prices","Book","Contact"],cafe:["Menu","Visit","About","Contact"],hair:["Services","Book","Team","Contact"],cleaning:["Services","Quote","About","Contact"],nails:["Treatments","Looks","Vouchers","Contact"],landscaping:["Services","Our work","Quote","Contact"],tattoo:["Artists","Book","Aftercare","Contact"],dog:["Services","Prices","Book","Contact"]}[P.cat]||[];
    app.innerHTML=`
      <header><div class="in"><div class="logo">${esc(P.name)}</div><nav>${nav.map(n=>`<span>${n}</span>`).join("")}</nav></div></header>
      <section class="hero"><div class="in">
        <div class="place">${esc(P.place)}</div>
        <h1>${esc(P.headline)}</h1>
        <p>${esc(P.sub)}</p>
        ${st.text?`<div class="status"><span class="dot ${st.open?"":"off"}"></span>${esc(st.text)}</div>`:""}
        <div class="ctas">${P.ctas.map(([t,k])=>`<span class="btn ${k}">${esc(t)}</span>`).join("")}</div>
      </div></section>
      <main><div class="in">
        <div class="trust">${P.trust.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
        <div class="grid2">
          <div><h2>${esc(P.menuTitle)}</h2><div class="list">${P.menu.map(([a,b])=>`<div class="row"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div></div>
          <div><h2>Opening hours</h2><div class="list">${P.hours.map(([a,b])=>`<div class="row"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div></div>
        </div>
        <div class="callout"><b>${esc(P.extraTitle)}</b>${esc(P.extra)}</div>
        <div><h2>Find us</h2><div class="contact">
          <div><span class="k">Address</span><br>${esc(P.address)}</div>
          ${P.phone?`<div><span class="k">Phone</span><br>${esc(P.phone)}</div>`:""}
          ${P.email?`<div><span class="k">Email</span><br>${esc(P.email)}</div>`:""}
          ${P.social?`<div><span class="k">Social</span><br>${esc(P.social)}</div>`:""}
        </div></div>
      </div></main>
      <footer><div class="in"><span>${esc(P.name)} · ${esc(P.place)}</span><span>Concept preview</span></div></footer>
      <p class="note">This is a free concept made by Charlie Bouchard (freelance web designer) using details from ${esc(P.name)}'s current public website. It is not the official site and nothing here is live. Like it? Reply to Charlie's email at charliebouchard208@gmail.com. Build £200, then £25 a month for hosting and changes.</p>`;
    window.scrollTo(0,0);
  }
  
  render();
})();
</script>
</html>
